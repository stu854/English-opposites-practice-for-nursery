<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Animal Opposites</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Arial Rounded MT Bold", sans-serif;
      background: linear-gradient(180deg, #fff8df, #e9f8ff);
      color: #243447;
      min-height: 100vh;
      display: flex;
      justify-content: center;
    }
    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .app {
      width: 100%;
      max-width: 700px;
      min-height: 100vh;
      padding: 16px;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
    }
    h1 {
      margin: 0;
      font-size: clamp(25px, 7vw, 40px);
      color: #f47c48;
    }
    .score {
      background: white;
      border: 3px solid #ffd166;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 18px;
      font-weight: 800;
      white-space: nowrap;
    }
    .progress {
      height: 12px;
      background: #d9e7ed;
      border-radius: 20px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #55c2a3, #ffd166);
      transition: width .3s ease;
    }
    .card {
      background: rgba(255,255,255,.94);
      border-radius: 30px;
      padding: 20px 16px;
      box-shadow: 0 8px 25px rgba(52, 86, 105, .12);
      text-align: center;
      flex: 1;
    }
    .instruction {
      font-size: 18px;
      font-weight: 700;
      color: #66808d;
      margin-bottom: 4px;
    }
    .question {
      min-height: 225px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }
    .animal {
      font-size: clamp(85px, 24vw, 145px);
      line-height: 1;
      animation: bounce .8s ease;
      filter: drop-shadow(0 5px 2px rgba(0,0,0,.08));
    }
    @keyframes bounce {
      0% { transform: scale(.7); }
      70% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }
    .word {
      margin-top: 12px;
      font-size: clamp(38px, 10vw, 62px);
      font-weight: 900;
      color: #345b70;
      letter-spacing: 1px;
    }
    .hear {
      margin-top: 10px;
      border: 0;
      background: #e7f6ff;
      color: #257aa1;
      border-radius: 18px;
      padding: 10px 18px;
      font-weight: 800;
      cursor: pointer;
    }
    .choices-title {
      margin: 12px 0 10px;
      font-size: 17px;
      color: #66808d;
      font-weight: 800;
    }
    .choices {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }
    .choice {
      min-height: 155px;
      background: #fff;
      border: 4px solid #dceaf0;
      border-radius: 24px;
      padding: 10px 5px;
      cursor: pointer;
      transition: transform .12s, border-color .12s, background .12s;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .choice:active {
      transform: scale(.94);
    }
    .choice .emoji {
      font-size: clamp(50px, 14vw, 80px);
      line-height: 1;
    }
    .choice .label {
      margin-top: 8px;
      font-size: clamp(17px, 5vw, 25px);
      font-weight: 900;
      color: #345b70;
    }
    .choice.correct {
      border-color: #55c878;
      background: #eaffef;
      animation: pop .35s ease;
    }
    .choice.wrong {
      border-color: #ff8b7b;
      background: #fff0ed;
      animation: shake .3s ease;
    }
    @keyframes pop {
      50% { transform: scale(1.06); }
    }
    @keyframes shake {
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }
    .message {
      min-height: 60px;
      margin-top: 12px;
      font-size: 23px;
      font-weight: 900;
      color: #55a66f;
    }
    .next {
      display: none;
      width: 100%;
      margin-top: 5px;
      border: 0;
      border-radius: 22px;
      background: #f47c48;
      color: white;
      padding: 15px;
      font-size: 23px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 5px 0 #d85f30;
    }
    .next:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #d85f30;
    }
    .start-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
    }
    .start-animals {
      font-size: 70px;
      margin-bottom: 15px;
    }
    .start-screen h2 {
      font-size: 34px;
      margin: 0 0 8px;
      color: #345b70;
    }
    .start-screen p {
      font-size: 20px;
      margin: 5px 0 25px;
      color: #66808d;
    }
    .start {
      border: 0;
      background: #55c2a3;
      color: white;
      padding: 17px 35px;
      border-radius: 25px;
      font-size: 26px;
      font-weight: 900;
      box-shadow: 0 6px 0 #3d9f84;
      cursor: pointer;
    }
    .finished {
      display: none;
      text-align: center;
      padding: 35px 10px;
    }
    .finished .big {
      font-size: 100px;
    }
    .finished h2 {
      font-size: 38px;
      color: #f47c48;
    }
    .finished p {
      font-size: 22px;
    }
    .restart {
      border: 0;
      background: #55c2a3;
      color: white;
      padding: 15px 30px;
      border-radius: 22px;
      font-size: 23px;
      font-weight: 900;
      cursor: pointer;
    }
    @media (max-width: 430px) {
      .choice {
        min-height: 135px;
      }
      .question {
        min-height: 190px;
      }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <h1>🐾 Animal Opposites</h1>
    <div class="score">⭐ <span id="score">0</span></div>
  </header>
  <div class="progress">
    <div class="progress-bar" id="progressBar"></div>
  </div>
  <main class="card">
    <section class="start-screen" id="startScreen">
      <div class="start-animals">🐘 🐭 🦁 🐢</div>
      <h2>Let's find opposites!</h2>
      <p>Listen, look, and tap.</p>
      <button class="start" id="startButton">▶️ Start</button>
    </section>
    <section id="gameScreen" style="display:none;">
      <div class="instruction">Find the opposite!</div>
      <div class="question">
        <div class="animal" id="questionEmoji">🐘</div>
        <div class="word" id="questionWord">BIG</div>
        <button class="hear" id="hearQuestion">🔊 Hear it again</button>
      </div>
      <div class="choices-title">Tap an answer</div>
      <div class="choices" id="choices"></div>
      <div class="message" id="message"></div>
      <button class="next" id="nextButton">Next 🐾</button>
    </section>
    <section class="finished" id="finishedScreen">
      <div class="big">🎉🦁🎉</div>
      <h2>Great job!</h2>
      <p>You practiced lots of opposites!</p>
      <p>⭐ Score: <strong id="finalScore">0</strong></p>
      <button class="restart" id="restartButton">Play Again</button>
    </section>
  </main>
</div>
<script>
/*
  Animal Opposites
  54 opposite pairs, practiced in BOTH directions.
  Speech uses the browser's built-in SpeechSynthesis API.
  No audio files or external services are needed.
*/
const pairs = [
  ["big", "small", "🐘", "🐭"],
  ["tall", "short", "🦒", "🐛"],
  ["hot", "cold", "☀️", "🧊"],
  ["fast", "slow", "🐆", "🐢"],
  ["happy", "sad", "😊", "😢"],
  ["up", "down", "🎈", "🪨"],
  ["in", "out", "🏠", "🌳"],
  ["open", "closed", "🚪", "🔒"],
  ["on", "off", "💡", "🌑"],
  ["day", "night", "☀️", "🌙"],
  ["light", "dark", "☀️", "🌑"],
  ["loud", "quiet", "🥁", "🤫"],
  ["old", "young", "👴", "👶"],
  ["new", "old", "🆕", "🧸"],
  ["good", "bad", "👍", "👎"],
  ["clean", "dirty", "🧼", "🟤"],
  ["full", "empty", "🥛", "🫗"],
  ["wet", "dry", "💦", "☀️"],
  ["hard", "soft", "🪨", "🧸"],
  ["heavy", "light", "🐘", "🪶"],
  ["near", "far", "🏠", "🌙"],
  ["high", "low", "✈️", "🐜"],
  ["inside", "outside", "🏠", "🌳"],
  ["front", "back", "🚗", "🚙"],
  ["left", "right", "👈", "👉"],
  ["before", "after", "🌅", "🌙"],
  ["first", "last", "🥇", "🏃"],
  ["early", "late", "🌅", "🌙"],
  ["awake", "asleep", "👀", "😴"],
  ["push", "pull", "🛒", "🚪"],
  ["give", "take", "🎁", "🤲"],
  ["come", "go", "🏠", "🚶"],
  ["start", "stop", "🏃", "🛑"],
  ["laugh", "cry", "😂", "😭"],
  ["love", "hate", "❤️", "😖"],
  ["true", "false", "✅", "❌"],
  ["same", "different", "👕", "👗"],
  ["easy", "difficult", "🙂", "🧩"],
  ["kind", "mean", "❤️", "😠"],
  ["brave", "scared", "🦁", "😨"],
  ["safe", "dangerous", "🪖", "🔥"],
  ["pretty", "ugly", "🌸", "🗑️"],
  ["thick", "thin", "📚", "📄"],
  ["wide", "narrow", "🛣️", "🚶"],
  ["long", "short", "🦒", "🐛"],
  ["deep", "shallow", "🌊", "🛁"],
  ["smooth", "rough", "🪞", "🪨"],
  ["sweet", "sour", "🍬", "🍋"],
  ["strong", "weak", "💪", "🐜"],
  ["many", "few", "🐟🐟🐟", "🐟"],
  ["more", "less", "🍪🍪🍪", "🍪"],
  ["all", "none", "👧👦👶", "⭕"],
  ["yes", "no", "👍", "👎"]
];
/*
  Convert the pairs into two directions.
  Example:
  BIG -> SMALL
  SMALL -> BIG
*/
let questions = [];
pairs.forEach(pair => {
  questions.push({
    word: pair[0],
    answer: pair[1],
    emoji: pair[2],
    answerEmoji: pair[3]
  });
  questions.push({
    word: pair[1],
    answer: pair[0],
    emoji: pair[3],
    answerEmoji: pair[2]
  });
});
let current = 0;
let score = 0;
let answered = false;
const startScreen = document.getElementById("startScreen");
const gameScreen = document.getElementById("gameScreen");
const finishedScreen = document.getElementById("finishedScreen");
const questionWord = document.getElementById("questionWord");
const questionEmoji = document.getElementById("questionEmoji");
const choices = document.getElementById("choices");
const message = document.getElementById("message");
const nextButton = document.getElementById("nextButton");
const scoreEl = document.getElementById("score");
const progressBar = document.getElementById("progressBar");
function speak(text) {
  if (!("speechSynthesis" in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.rate = 0.78;
  utterance.pitch = 1.15;
  utterance.volume = 1;
  window.speechSynthesis.speak(utterance);
}
function shuffle(array) {
  return [...array].sort(() => Math.random() - 0.5);
}
function getChoicePool(correct) {
  /*
    Pick two distractors from other words.
    We avoid using the current word as a choice.
  */
  const candidates = [];
  questions.forEach(q => {
    if (
      q.answer !== correct &&
      q.word !== correct &&
      !candidates.includes(q.answer)
    ) {
      candidates.push(q.answer);
    }
  });
  return shuffle(candidates).slice(0, 2);
}
function findEmojiForWord(word) {
  for (const pair of pairs) {
    if (pair[0] === word) return pair[2];
    if (pair[1] === word) return pair[3];
  }
  return "🐾";
}
function showQuestion() {
  if (current >= questions.length) {
    finishGame();
    return;
  }
  answered = false;
  message.textContent = "";
  nextButton.style.display = "none";
  const q = questions[current];
  questionWord.textContent = q.word.toUpperCase();
  questionEmoji.textContent = q.emoji;
  progressBar.style.width =
    `${(current / questions.length) * 100}%`;
  const distractors = getChoicePool(q.answer);
  const options = shuffle([
    q.answer,
    ...distractors
  ]);
  choices.innerHTML = "";
  options.forEach(option => {
    const button = document.createElement("button");
    button.className = "choice";
    button.dataset.answer = option;
    const emoji = document.createElement("div");
    emoji.className = "emoji";
    emoji.textContent = findEmojiForWord(option);
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = option.toUpperCase();
    button.appendChild(emoji);
    button.appendChild(label);
    /*
      Tapping a choice also reads the choice aloud.
    */
    button.addEventListener("click", () => {
      speak(option);
      checkAnswer(button, option, q.answer);
    });
    choices.appendChild(button);
  });
  /*
    Automatically read the question and then the choices.
  */
  setTimeout(() => {
    speak(q.word);
  }, 400);
  setTimeout(() => {
    options.forEach((option, index) => {
      setTimeout(() => speak(option), index * 900);
    });
  }, 1500);
}
function checkAnswer(button, selected, correct) {
  if (answered) return;
  if (selected === correct) {
    answered = true;
    score++;
    scoreEl.textContent = score;
    button.classList.add("correct");
    const praise = [
      "Great job!",
      "Yes!",
      "You got it!",
      "Amazing!",
      "Super!"
    ];
    const text =
      praise[Math.floor(Math.random() * praise.length)] +
      " " +
      correct +
      " is the opposite!";
    message.textContent = text;
    speak(text);
    document.querySelectorAll(".choice").forEach(b => {
      b.disabled = true;
    });
    nextButton.style.display = "block";
  } else {
    button.classList.add("wrong");
    /*
      We do not say "wrong."
      We give a gentle clue by repeating the question.
    */
    message.textContent = "Try another one! 🐾";
    speak("Try another one");
    setTimeout(() => {
      button.classList.remove("wrong");
    }, 500);
  }
}
function nextQuestion() {
  current++;
  showQuestion();
}
function finishGame() {
  gameScreen.style.display = "none";
  finishedScreen.style.display = "block";
  document.getElementById("finalScore").textContent = score;
  progressBar.style.width = "100%";
  speak("Great job! You practiced opposites!");
}
function startGame() {
  current = 0;
  score = 0;
  scoreEl.textContent = "0";
  /*
    Shuffle the full question list so the game feels different
    each time. Both directions remain included.
  */
  questions = shuffle(questions);
  startScreen.style.display = "none";
  finishedScreen.style.display = "none";
  gameScreen.style.display = "block";
  showQuestion();
}
document.getElementById("startButton")
  .addEventListener("click", startGame);
document.getElementById("hearQuestion")
  .addEventListener("click", () => {
    speak(questionWord.textContent);
  });
nextButton.addEventListener("click", nextQuestion);
document.getElementById("restartButton")
  .addEventListener("click", startGame);
/*
  On some phones, speech works best after the first user tap.
  Starting the game is that user interaction.
*/
</script>
</body>
</html>
